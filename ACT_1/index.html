<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Validar Formulari</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
    <form id="form" class="form">
        <h2>FORMULARI</h2>
        <div class="form-control">
            <label for="username">Nom d'usuari</label>
            <input type="text" id="username" placeholder="Introdueix el teu nom d'usuari">
            <small>Error Message</small>
        </div>
        <div class="form-control">
            <label for="email">Correu electrònic</label>
            <input type="text" id="email" placeholder="Introdueix el teu correu electrònic">
            <small>Error Message</small>
        </div>
        <div class="form-control">
            <label for="password">Contrasenya</label>
            <input type="password" id="password" placeholder="Introdueix la teva contrasenya">
            <small>Error Message</small>
        </div>
        <div class="form-control">
            <label for="password2">Confirmar Contrasenya</label>
            <input type="password" id="password2" placeholder="Introdueix de nou la teva contrasenya">
            <small>Error Message</small>
        </div>
        <div class="form-control">
            <label for="edat">Edat</label>
            <input type="number" id="edat" placeholder="Introdueix la teva edat">
            <small>Error Message</small>
        </div>
        <button type="submit">Enviar</button>
    </form>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
